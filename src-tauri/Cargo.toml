[package]
name = "backseat"
version = "1.6.1"
edition = "2021"

[lib]
name = "backseat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell  = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "deflate", "charset", "rustls-tls"] }
tokio       = { version = "1",    features = ["full"] }
async-trait = "0.1"

dirs        = "5"
walkdir     = "2"
urlencoding = "2"
chrono      = { version = "0.4", features = ["serde"] }
base64      = "0.22"
uuid        = { version = "1",  features = ["v4"] }
futures   = "0.3"
keyring   = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
log       = "0.4"
simplelog = "0.12"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
